
name: QuickBuy CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Automated Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask "psycopg[binary]" requests pika

      - name: Run unit tests
        run: python -m pytest tests/ -v

  security-scan:
    name: Run SonarQube Security Analysis
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run SonarQube SAST and Quality Gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
