
name: QuickBuy CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  unit-tests:
    name: Run Automated Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask "psycopg[binary]" requests pika

      - name: Run unit tests
        run: python -m pytest tests/ -v
