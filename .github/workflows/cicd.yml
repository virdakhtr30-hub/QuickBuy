
name: QuickBuy CI/CD Pipeline

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quickbuy-production
  cancel-in-progress: false

jobs:
  unit-tests:
    name: Run Automated Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install testing dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest flask "psycopg[binary]" requests pika

      - name: Run unit tests
        run: python -m pytest tests/ -v

  security-scan:
    name: Run SonarQube Security Analysis
    needs: unit-tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Run SonarQube SAST and Quality Gate
        uses: SonarSource/sonarqube-scan-action@59202af334b4ba7b5db01b701b8e79f8b3bef0f4
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300

    
  build-artifact:
    name: Build and Package QuickBuy
    needs: security-scan
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Generate image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Build Inventory Service image
        run: |
          docker build --platform linux/amd64 \
            -t quickbuy-inventory:$IMAGE_TAG \
            ./services/inventory-service

      - name: Build Order Service image
        run: |
          docker build --platform linux/amd64 \
            -t quickbuy-order:$IMAGE_TAG \
            ./services/order-service

      - name: Build Notification Service image
        run: |
          docker build --platform linux/amd64 \
            -t quickbuy-notification:$IMAGE_TAG \
            ./services/notification-service

      - name: Export Docker images
        run: |
          mkdir -p build-artifact

          docker save -o build-artifact/quickbuy-images.tar \
            quickbuy-inventory:$IMAGE_TAG \
            quickbuy-order:$IMAGE_TAG \
            quickbuy-notification:$IMAGE_TAG

      - name: Package deployment artifact
        run: |
          cp compose.yaml build-artifact/
          cp -r frontend gateway database build-artifact/

          cd build-artifact
          zip -r "../quickbuy-build-$IMAGE_TAG.zip" .

      - name: Verify generated artifact
        run: |
          ls -lh "quickbuy-build-$IMAGE_TAG.zip"
          unzip -l "quickbuy-build-$IMAGE_TAG.zip"
          unzip -t "quickbuy-build-$IMAGE_TAG.zip"

      - name: Upload deployment artifact
        uses: actions/upload-artifact@v6
        with:
          name: quickbuy-build-${{ env.IMAGE_TAG }}
          path: quickbuy-build-${{ env.IMAGE_TAG }}.zip
          if-no-files-found: error
          retention-days: 3
          compression-level: 0

      
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Upload deployment artifact to AWS S3
        run: |
          aws s3 cp "quickbuy-build-$IMAGE_TAG.zip" \
            "s3://quickbuy-deployment-artifacts-2026/builds/quickbuy-build-$IMAGE_TAG.zip" \
            --only-show-errors

          echo "Successfully uploaded quickbuy-build-$IMAGE_TAG.zip to AWS S3"

  
  deploy-production:
    name: Deploy QuickBuy to AWS EC2
    needs: build-artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Checkout source code
        uses: actions/checkout@v5

      - name: Generate deployment image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify SSM connectivity
        shell: bash
        run: |
          set -euo pipefail

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Verify QuickBuy EC2 connectivity" \
            --parameters '{"commands":["set -e","whoami","hostname","docker --version","docker compose version","test -f /opt/quickbuy/.env","curl -fsS http://localhost:8080/ > /dev/null","echo SSM connectivity verified"]}' \
            --query "Command.CommandId" \
            --output text)

          echo "SSM command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" || true

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          STATUS=$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query "Status" \
            --output text)

          if [ "$STATUS" != "Success" ]; then
            echo "SSM connectivity verification failed: $STATUS"
            exit 1
          fi

      - name: Execute automated deployment on EC2
        shell: bash
        run: |
          set -euo pipefail

          # Validate deployment script syntax
          bash -n deployment/deploy.sh

          # Encode script for safe transfer through SSM
          SCRIPT_BASE64=$(base64 -w 0 deployment/deploy.sh)

          # Prepare remote shell commands
          PARAMETERS=$(jq -n \
            --arg script "$SCRIPT_BASE64" \
            --arg tag "$IMAGE_TAG" \
            '{
              commands: [
                "set -e",
                "TEMP_SCRIPT=$(mktemp /tmp/quickbuy-deploy-XXXXXX.sh)",
                "trap '\''rm -f \"$TEMP_SCRIPT\"'\'' EXIT",
                ("printf %s " + $script + " | base64 -d > \"$TEMP_SCRIPT\""),
                ("bash \"$TEMP_SCRIPT\" " + $tag)
              ],
              executionTimeout: ["600"]
            }')

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "Deploy QuickBuy version $IMAGE_TAG" \
            --parameters "$PARAMETERS" \
            --timeout-seconds 600 \
            --query "Command.CommandId" \
            --output text)

          echo "Deployment command ID: $COMMAND_ID"
          echo "Deploying QuickBuy version: $IMAGE_TAG"

          # Poll SSM until deployment completes
          for attempt in $(seq 1 120); do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text 2>/dev/null || echo "Pending")

            echo "Attempt $attempt - Deployment status: $STATUS"

            case "$STATUS" in
              Success|Failed|Cancelled|TimedOut|Cancelling)
                break
                ;;
            esac

            sleep 5
          done

          # Display remote deployment logs
          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$EC2_INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent,Errors:StandardErrorContent}' \
            --output json

          # Fail GitHub Actions if deployment did not succeed
          if [ "$STATUS" != "Success" ]; then
            echo "QuickBuy deployment failed: $STATUS"
            exit 1
          fi

          echo "QuickBuy deployed successfully: $IMAGE_TAG"


