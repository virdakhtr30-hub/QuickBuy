
events {}

http {
    include /etc/nginx/mime.types;
    resolver 127.0.0.11 valid=5s;

    server {
        listen 80;

        # Frontend
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        location /api/products {
            set $inventory_backend inventory-service:5001;
            proxy_pass http://$inventory_backend/products;
        }

        location /api/reservations {
            set $inventory_backend inventory-service:5001;
            proxy_pass http://$inventory_backend/reservations;
        }

        location /api/orders {
            # Old configuration when Order Service ran on Windows
            # proxy_pass http://host.docker.internal:5002/orders;

            # Previous configuration with one Dockerized Order Service (Nginx)
            # proxy_pass http://order-service:5002/orders;

            # Configuration for scaling Order Service
            set $order_backend order-service:5002;
            proxy_pass  http://$order_backend/orders;
        }

        location /api/notifications {
            set $notification_backend notification-service:5003;
            proxy_pass http://$notification_backend/notifications;
        }
    }
}
